name: Release (Windows offline)

# git tag 推送即触发：构建前端 → 下载 Python wheels → 装配目录 → 打 zip →
# 上传到 GitHub Release。日常开发不触发；只在 `git tag v0.x.y && git push --tags` 时跑。
on:
  push:
    tags:
      - "v*"
  # 手工触发：不发 tag 就跑一遍 build，验证 Windows runner 的 npm build + pip
  # download 链路（Rolldown EPERM 等环境差异提早暴露）。workflow_dispatch 跑
  # 时没有 tag context，version 会回退成 "dev"（GITHUB_REF_NAME 是 branch 名）。
  workflow_dispatch:

permissions:
  contents: write       # softprops/action-gh-release 上传产物
  id-token: write       # Phase 14: artifact attestation 需 OIDC
  attestations: write   # Phase 14: actions/attest-build-provenance

jobs:
  build-windows-offline:
    name: Build DataOpsStudio-win-offline-{version}.zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Extract version from tag
        id: version
        shell: bash
        # refs/tags/v0.2.0 → 0.2.0
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run offline release packaging script
        shell: pwsh
        run: |
          .\scripts\build_offline_windows.ps1 -Version ${{ steps.version.outputs.version }}

      # Phase 14: 给 release 产物加来源证明 ——通过 SLSA-style attestation 让下载
      # 者能验证「这个 zip 真的是这个 commit / 这个 workflow 跑出来的」
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: DataOpsStudio-win-offline-${{ steps.version.outputs.version }}.zip

      # workflow_dispatch 触发时没 tag，跳过上传（artifact 留在 Actions run 里供查）
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: DataOpsStudio-win-offline-${{ steps.version.outputs.version }}.zip
          # release-please 合 PR 时已经创了 release 并填好 notes（基于 CHANGELOG）。
          # 这里 draft:false 避免把已发布的 release 反向藏成 draft；
          # generate_release_notes:false 避免覆盖 release-please 的分组 notes。
          draft: false
          generate_release_notes: false

      # workflow_dispatch 跑时也留 zip 供下载验证
      - name: Upload zip as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dataops-studio-offline-zip
          path: DataOpsStudio-win-offline-*.zip
          retention-days: 7
