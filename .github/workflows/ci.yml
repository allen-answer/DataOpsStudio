name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Phase 14: dependency-review 需要读 PR diff;sbom job 上传 artifact
  pull-requests: read

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 编译期 syntax 检查 —— 防止 import-time SyntaxError 漏到运行时才暴露
      - name: Compile-check all Python sources
        run: python -m compileall -q app main.py tests

      - name: Run pytest
        run: pytest -q

      # scenario 静态体检 —— 纯 Python、不连 DB / 不调 LLM。catch yml 笔误、
      # generator 运行期才炸的 bug（未知 dist kind / 坏 range）、anomaly /
      # derives_from 交叉引用错配、模板变量漏定义。CI 友好：退出码 1 即红。
      - name: Lint scenarios
        run: python scripts/scenario_lint.py --strict

  frontend-build:
    name: Frontend (vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vitest 单测（store / api wrapper / ErrorBoundary 等关键组件）
      # 跑得快（< 2s），先于 build 暴露逻辑层 regression
      - name: Run Vitest
        run: npm test

      # vue-tsc 类型检查 —— S3.B 起 stores/*.ts 有类型；后续轮次扩到 view
      # 包 .vue 文件（lang="ts"）+ composables，覆盖率随 TS 渐进迁移
      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build SPA
        run: npm run build

      # 把 build 产物当 artifact 上传 —— 失败时方便排查；release 流程也可以基于这个
      - name: Upload SPA artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: spa-build
          path: static/spa/
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # 扫描【当前工作树的 tracked 文件】是否含真实运维信息（私钥 / 云密钥 /
      # 高熵 token）。用 `gitleaks dir` 而非 `gitleaks git` —— 只看当前状态，
      # 不翻历史，所以历史里已存在的提交不会让 CI 永久变红。
      # --redact：CI 日志只报命中文件/规则，不打印 secret 明文。
      - name: Run gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          chmod +x gitleaks
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose --exit-code 1

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # #19 起从 advisory 升级为 fail-on-high/critical:
    # - high/critical CVE 直接 fail CI 阻塞合并
    # - medium/low 仍是 advisory(pip-audit 默认输出但不 exit 1)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # pip-audit 查 requirements.txt 里的依赖是否命中已知 CVE(PyPI Advisory DB)
      # --strict 让 vuln 出现就 exit 1 — 我们用 jq 二次过滤只 fail on high/critical
      - name: pip-audit (Python deps) - fail on high/critical
        run: |
          python -m pip install --upgrade pip pip-audit
          # 先输出可读 audit 结果给日志,不 exit 上
          pip-audit -r requirements.txt --desc || true
          # 然后用 json 模式 + jq 精确判定:有任何 high/critical 即 fail
          pip-audit -r requirements.txt --format json > pip-audit.json || true
          HIGHS=$(jq '[.dependencies[]?.vulns[]? | select(.fix_versions != null) | .id] | length' pip-audit.json 2>/dev/null || echo 0)
          # 没 jq 时退而求其次:简单 grep severity high/critical
          if grep -qiE '"severity":\s*"(high|critical)"' pip-audit.json 2>/dev/null; then
            echo "::error::pip-audit found high/critical CVE(s) — check job log above"
            exit 1
          fi
          echo "pip-audit clean (no high/critical)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      # npm audit 查前端依赖,--audit-level=high 让 high/critical 退出码非 0 → fail CI
      - name: npm audit (frontend deps) - fail on high/critical
        working-directory: frontend/frontend
        run: npm audit --audit-level=high

  # Phase 14: dependency-review-action —— PR 时拦截新引入的高危依赖 CVE。
  # 跟 dependency-audit job 互补:audit 看 requirements.txt 现有的依赖,
  # dependency-review 看 PR diff 引入了什么新依赖(防"补一个 fix 顺手塞了
  # vulnerable lib" 这种)。仅 PR 触发,push 跳过(没 base 可比)。
  dependency-review:
    name: Dependency review (PR diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        with:
          fail-on-severity: high  # high / critical 才阻塞,中低 advisory

  # Phase 14: 生成 CycloneDX SBOM 跟 backend / frontend 依赖列表。SBOM
  # 是软件供应链的"成分表",安全审计 + 合规 + CVE 反查都依赖它。仅 push
  # 到 main 时生成,artifact 保留 90 天(够审计期).
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom

      # backend Python SBOM
      - name: Generate Python SBOM
        run: |
          cyclonedx-py requirements -i requirements.txt -o sbom-python.json

      # frontend Node SBOM 用 @cyclonedx/cyclonedx-npm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Install frontend deps + cyclonedx-npm
        working-directory: frontend/frontend
        run: |
          npm ci
          npm install --no-save @cyclonedx/cyclonedx-npm

      - name: Generate Node SBOM
        working-directory: frontend/frontend
        run: npx @cyclonedx/cyclonedx-npm --output-file ../../sbom-node.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: |
            sbom-python.json
            sbom-node.json
          retention-days: 90

  docker-build:
    name: Docker (multi-stage build smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # 不 push 镜像，只验证 Dockerfile 本身能 build 通（含 node 阶段构建前端 +
      # python 阶段装依赖）。catch 类似"修了 import 但忘改 Dockerfile COPY 路径"
      # 那种 bug —— pytest / npm build 都过、Dockerfile 装不上才发现。
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: false
          tags: dataops-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
