# Dependabot —— 依赖版本更新 + 安全更新（安全加固方案 CI 基线）。
# 每个生态用 groups 把更新合成一个 PR，避免 PR 刷屏。
version: 2
updates:
  # Python 后端依赖（requirements.txt）
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]

  # 前端 npm 依赖（frontend/frontend/package.json）
  - package-ecosystem: npm
    directory: "/frontend/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns: ["*"]

  # GitHub Actions 自身（.github/workflows/*.yml 里 pin 的 action 版本）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
