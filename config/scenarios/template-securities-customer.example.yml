# 证券行业模板 · 客户-账户简化版(3 表关联)
# 适合做 demo / 入门体验,跑 30s 内
id: securities-customer-template
name: 证券行业 · 客户-账户(3 表 FK 简化)
description: 入门模板。客户 → 资金账户 → 交易订单的 3 表关联,展示基础 FK 用法
dialect: mysql
seed: 42

tables:
  - name: customer
    role: source
    rows: 10000
    columns:
      - {name: cust_id, type: VARCHAR(40), pk: true, nullable: false,
         gen: realistic, faker_provider: fund_acc_no}
      - {name: cust_name, type: VARCHAR(40),
         gen: realistic, faker_provider: chinese_name_individual}
      - {name: id_no, type: VARCHAR(20),
         gen: realistic, faker_provider: chinese_id}
      - {name: mobile, type: VARCHAR(20),
         gen: realistic, faker_provider: mobile_phone}
      - {name: open_date, type: DATETIME,
         gen: timestamp, range: ["2020-01-01","2026-05-24"]}
    indexes:
      - {columns: [cust_id], unique: true}

  - name: account
    role: source
    rows: 20000          # 1 客户平均 2 账户
    columns:
      - {name: acct_id, type: VARCHAR(40), pk: true, nullable: false,
         gen: realistic, faker_provider: shareholder_acc_sh}
      - {name: cust_id, type: VARCHAR(40), nullable: false,
         gen: foreign_key, references: customer.cust_id,
         fk_distribution: zipf, fk_zipf_alpha: 1.2}
      - {name: market_code, type: VARCHAR(4),
         gen: realistic, faker_provider: market_code}
      - {name: balance, type: "DECIMAL(18,2)",
         gen: realistic,
         dist_params: {kind: lognormal, mu: 9.5, sigma: 1.8, min: 0}}
      - {name: status, type: VARCHAR(4),
         gen: enum, values: ["0","1","3"], distribution: [0.85, 0.10, 0.05]}
    indexes:
      - {columns: [cust_id]}
      - {columns: [market_code]}

  - name: order_tbl
    role: source
    rows: 200000         # 1 账户平均 10 订单
    columns:
      - {name: order_id, type: BIGINT, pk: true, nullable: false,
         gen: sequence}
      - {name: acct_id, type: VARCHAR(40), nullable: false,
         gen: foreign_key, references: account.acct_id,
         fk_distribution: zipf, fk_zipf_alpha: 1.3}
      - {name: securities_code, type: VARCHAR(6),
         gen: realistic, faker_provider: securities_code_sh}
      - {name: amount, type: "DECIMAL(18,4)",
         gen: realistic,
         dist_params: {kind: lognormal, mu: 7.0, sigma: 1.5, min: 0}}
      - {name: order_time, type: DATETIME,
         gen: timestamp, range: ["2026-01-01","2026-05-24"]}

workloads:
  - kind: slow_query
    name: customer-account-order-stats
    dialect: mysql
    sql: |
      SELECT c.cust_name, COUNT(o.order_id) as order_cnt, SUM(o.amount) as total
      FROM customer c
      JOIN account a ON a.cust_id = c.cust_id
      JOIN order_tbl o ON o.acct_id = a.acct_id
      WHERE a.status = '0' AND o.order_time >= '2026-04-01'
      GROUP BY c.cust_name
      ORDER BY total DESC
      LIMIT 100
    intentional_issues:
      - "未在 order_tbl.order_time 上加索引,WHERE 走全表扫"
      - "GROUP BY cust_name 不在索引,触发 filesort"
    expected_optimizations:
      - "为 order_tbl 加 (order_time, acct_id) 复合索引"
      - "改写为 join cust_id 而非 cust_name 减少回表"
