services:
  mysql8:
    image: mysql:8.0
    container_name: mysql8
    # MySQL 8 docker 镜像 client/results 默认 latin1，UTF-8 init script 会被
    # 当 latin1 解释 → utf8mb4 列里写 mojibake。强制 server / connect 默认走
    # utf8mb4，避免下次起容器或第三方 mysql client 又踩同一个坑。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dataops
    ports:
      - "3307:3306"
    volumes:
      - ./init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    container_name: dataops-studio
    ports:
      - "8010:8010"
    volumes:
      # static/spa 不再 mount —— 改 Dockerfile 里 frontend 阶段构建后直接打入镜像。
      # 想 dev 模式热改前端：`cd frontend/frontend && npm run dev`，vite proxy 到 app:8000。
      - ./config:/app/config
      - ./results:/app/results
      - ./logs:/app/logs
    depends_on:
      mysql8:
        condition: service_healthy
    restart: unless-stopped
