services:
  # 可选 demo 数据源：仅本地演示 / 测试样例需要。
  # 默认 `docker compose up` 不启动 MySQL，app 自身不依赖任何应用元数据库。
  # 如需样例库：`docker compose --profile demo-db up -d --build`
  mysql8:
    profiles: ["demo-db"]
    image: mysql:8.0
    container_name: mysql8
    # MySQL 8 docker 镜像 client/results 默认 latin1，UTF-8 init script 会被
    # 当 latin1 解释 → utf8mb4 列里写 mojibake。强制 server / connect 默认走
    # utf8mb4，避免下次起容器或第三方 mysql client 又踩同一个坑。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dataops
    ports:
      - "3307:3306"
    volumes:
      - ./init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    container_name: dataops-studio
    environment:
      LD_LIBRARY_PATH: /usr/local/lib/python3.12/site-packages/dmssl:/usr/local/lib/python3.12/site-packages/dmpython.libs
    ports:
      - "8010:8010"
    volumes:
      # static/spa 不再 mount —— 改 Dockerfile 里 frontend 阶段构建后直接打入镜像。
      # 想 dev 模式热改前端：`cd frontend/frontend && npm run dev`，vite proxy 到 app:8000。
      - ./config:/app/config
      - ./results:/app/results
      - ./logs:/app/logs
    restart: unless-stopped

  # 浏览器 e2e（可选 profile，默认 docker compose up 不启动）
  # 跑法：docker compose --profile e2e run --rm e2e
  # 主 image 不装 chromium（prod 不需要），单独 build tests/e2e/Dockerfile。
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    # 用 host network：chromium 对自定义 hostname (`app`) 会触发 HTTPS Upgrade
    # 把 http://app:8010 自动改成 https → SSL 错。从 localhost 访问就跳过这套。
    network_mode: host
    # 宿主 tests/ bind-mount 进容器，改测试不用 rebuild image
    volumes:
      - ./tests:/app/tests:ro
    environment:
      E2E_BASE_URL: http://localhost:8010
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    # network_mode: host 时 docker-compose 不让用 depends_on 加 condition；
    # 跑前确保 app 已经 up。
